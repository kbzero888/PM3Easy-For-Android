name: Build PM3Droid APK, 512KB Firmware & Windows CLI

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build_android_and_firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout PM3Droid Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;26.3.11579264 platforms;android-34 build-tools;34.0.0'

      - name: Install Host & ARM Embedded Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git cmake pkg-config autoconf automake libtool texinfo gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Cross-Compile PM3 Client (arm64-v8a) & 512KB Firmware (HF_14ASNIFF)
        env:
          NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
          API: 26
          TARGET: aarch64-linux-android
        run: |
          set -e
          TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"
          PREFIX="$GITHUB_WORKSPACE/sysroot-arm64"
          mkdir -p "$PREFIX/include" "$PREFIX/lib" "$GITHUB_WORKSPACE/build-deps"

          export AR="$TOOLCHAIN/bin/llvm-ar"
          export CC="$TOOLCHAIN/bin/${TARGET}${API}-clang"
          export CXX="$TOOLCHAIN/bin/${TARGET}${API}-clang++"
          export LD="$TOOLCHAIN/bin/ld"
          export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
          export STRIP="$TOOLCHAIN/bin/llvm-strip"
          export CFLAGS="-O2 -fPIC -I$PREFIX/include"
          export CXXFLAGS="-O2 -fPIC -I$PREFIX/include"
          export LDFLAGS="-L$PREFIX/lib"

          cd "$GITHUB_WORKSPACE/build-deps"

          # 1. Build bzip2 1.0.8 directly via NDK clang
          curl -LO https://sourceware.org/pub/bzip2/bzip2-1.0.8.tar.gz
          tar -xzf bzip2-1.0.8.tar.gz
          cd bzip2-1.0.8
          $CC $CFLAGS -c blocksort.c huffman.c crctable.c randtable.c compress.c decompress.c bzlib.c
          $AR rcs "$PREFIX/lib/libbz2.a" blocksort.o huffman.o crctable.o randtable.o compress.o decompress.o bzlib.o
          $RANLIB "$PREFIX/lib/libbz2.a"
          cp bzlib.h "$PREFIX/include/"
          cd ..

          # 2. Build lz4 (required by cmdhfmfhard.c)
          git clone --depth 1 https://github.com/lz4/lz4.git
          cd lz4/lib
          $CC $CFLAGS -c lz4.c lz4hc.c lz4frame.c xxhash.c
          $AR rcs "$PREFIX/lib/liblz4.a" lz4.o lz4hc.o lz4frame.o xxhash.o
          $RANLIB "$PREFIX/lib/liblz4.a"
          cp lz4.h lz4hc.h lz4frame.h "$PREFIX/include/"
          cd ../..

          # 3. Build jansson
          git clone --depth 1 https://github.com/akheron/jansson.git
          cd jansson
          autoreconf -fi
          ./configure --host=$TARGET --prefix="$PREFIX" --enable-static --disable-shared
          make -j$(nproc) && make install
          cd ..

          # 4. Build ncurses (required by readline)
          curl -LO https://ftp.gnu.org/gnu/ncurses/ncurses-6.4.tar.gz
          tar -xzf ncurses-6.4.tar.gz
          cd ncurses-6.4
          ./configure --host=$TARGET --prefix="$PREFIX" --without-shared --without-debug --without-ada --without-manpages --without-progs --without-tests --with-termlib
          make -j$(nproc) && make install
          cd ..

          # 5. Build readline
          curl -LO https://ftp.gnu.org/gnu/readline/readline-8.2.tar.gz
          tar -xzf readline-8.2.tar.gz
          cd readline-8.2
          ./configure --host=$TARGET --prefix="$PREFIX" --enable-static --disable-shared bash_cv_wcwidth_broken=no
          make -j$(nproc) SHLIB_LIBS="-ltinfo" && make install
          cd ..

          # 6. Clone & Cross-Compile RfidResearchGroup/proxmark3 Client & Firmware
          cd "$GITHUB_WORKSPACE"
          rm -rf pm3-src
          git clone --depth 1 https://github.com/RfidResearchGroup/proxmark3.git pm3-src
          cd pm3-src

          # Initialize platform definition cache for PM3 Easy 512KB (PM3GENERIC) with HF_14ASNIFF
          make PLATFORM=PM3GENERIC STANDALONE=HF_14ASNIFF clean

          # Strip -Werror and force aarch64 in hardnested
          find . -name "Makefile*" -exec sed -i 's/-Werror//g' {} +
          sed -i 's/uname -m/echo aarch64/g' client/deps/hardnested/Makefile || true

          # Build host-native fpga_compress first so armsrc/all can compress FPGA bitstreams on x86_64 runner
          make -C tools/fpga_compress clean
          make -C tools/fpga_compress -j$(nproc)

          unset CFLAGS CXXFLAGS LDFLAGS

          # 6a. Build matching bootrom.elf and fullimage.elf with physical button HF_14ASNIFF standalone mode
          # Note: fpga_compress was already built for x86_64 host, so make armsrc/all reuses it
          make -j$(nproc) PLATFORM=PM3GENERIC STANDALONE=HF_14ASNIFF bootrom/all armsrc/all
          mkdir -p "$GITHUB_WORKSPACE/pm3-firmware"
          cp bootrom/obj/bootrom.elf "$GITHUB_WORKSPACE/pm3-firmware/"
          cp armsrc/obj/fullimage.elf "$GITHUB_WORKSPACE/pm3-firmware/"

          # 6b. Build ARM64 Android client binary
          cd client
          make -j$(nproc) \
            CC="$CC -O2 -fPIC -isystem $PREFIX/include -Wno-unused-command-line-argument -D__ANDROID__" \
            CXX="$CXX -O2 -fPIC -isystem $PREFIX/include -Wno-unused-command-line-argument -D__ANDROID__" \
            LD="$CXX -L$PREFIX/lib -Wl,--allow-multiple-definition" \
            AR="$AR rcs" \
            RANLIB="$RANLIB" \
            STRIP="$STRIP" \
            PLATFORM=PM3GENERIC \
            STANDALONE=HF_14ASNIFF \
            SKIPQT=1 \
            SKIPBT=1 \
            SKIPPCSC=1 \
            SKIPGD=1 \
            SKIPZSTD=1 \
            SKIPWHEREAMI=1 \
            SKIPPYTHON=1 \
            LDLIBS="-L$PREFIX/lib -lreadline -ltinfo -ljansson -llz4 -lbz2 -lz -lm -llog"

          $STRIP proxmark3

          # Package binary as libproxmark3.so inside jniLibs so Android extracts it with +x permission
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp proxmark3 "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libproxmark3.so"

          # Bundle dictionaries and lua scripts into assets
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/assets/pm3"
          cp -r dictionaries "$GITHUB_WORKSPACE/app/src/main/assets/pm3/"
          cp -r lualibs "$GITHUB_WORKSPACE/app/src/main/assets/pm3/" || true

      - name: Generate Gradle Wrapper & Build Debug APK
        run: |
          cd "$GITHUB_WORKSPACE"
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PM3Droid-arm64-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Matching PM3 Easy 512KB Firmware Artifact (HF_14ASNIFF)
        uses: actions/upload-artifact@v4
        with:
          name: PM3Easy-512KB-firmware-HF_14ASNIFF
          path: |
            pm3-firmware/bootrom.elf
            pm3-firmware/fullimage.elf
          retention-days: 30

  build_windows_cli:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Setup MSYS2 Mingw64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-readline
            mingw-w64-x86_64-jansson
            mingw-w64-x86_64-bzip2
            mingw-w64-x86_64-lz4
            mingw-w64-x86_64-zstd

      - name: Clone & Build Windows CLI (PM3GENERIC + HF_14ASNIFF)
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p /c/pm3-build && cd /c/pm3-build
          rm -rf pm3-src
          git clone --depth 1 https://github.com/RfidResearchGroup/proxmark3.git pm3-src
          cd pm3-src

          make PLATFORM=PM3GENERIC STANDALONE=HF_14ASNIFF clean
          cd client
          make -j$(nproc) PLATFORM=PM3GENERIC STANDALONE=HF_14ASNIFF SKIPQT=1 SKIPGD=1 SKIPBT=1 SKIPPYTHON=1

          mkdir -p /c/pm3-win-cli
          cp proxmark3.exe /c/pm3-win-cli/
          cp -r dictionaries /c/pm3-win-cli/ || true
          cp -r lualibs /c/pm3-win-cli/ || true

          # Copy dependent MinGW64 DLLs so proxmark3.exe runs standalone
          ldd proxmark3.exe | awk '/=> \/mingw64\// {print $3}' | sort -u | while read -r dll; do
            cp "$dll" /c/pm3-win-cli/ || true
          done

      - name: Upload Windows CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PM3Easy-Windows-CLI
          path: C:/pm3-win-cli/**
          retention-days: 30
